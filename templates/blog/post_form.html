{% extends "base.html" %}
{% block title %}{{ heading }} · Blog Django{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ heading }}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a class="btn secondary" href="{% url 'post_list' %}">Cancelar</a>
  </form>
</section>
{% endblock %}
