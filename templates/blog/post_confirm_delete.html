{% extends "base.html" %}
{% block title %}Eliminar publicación · Blog Django{% endblock %}
{% block content %}
<section class="card">
  <h1>Eliminar publicación</h1>
  <p>¿Confirmas que quieres eliminar <strong>{{ post.title }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn danger">Sí, eliminar</button>
    <a class="btn secondary" href="{{ post.get_absolute_url }}">Cancelar</a>
  </form>
</section>
{% endblock %}
